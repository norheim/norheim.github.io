<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Snap-Fit Cantilever Explorer</title>
<style>
  :root { --bg:#f8f8f5; --card:#fff; --text:#1b1b1b; --muted:#666; --line:#ddd; --accent:#1f4f7a; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --text:#ececea; --muted:#a3a39e; --line:#34342f; --accent:#8fb8de; --err:#f28b82; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:32px 28px; visibility:hidden; }
  .card.ready { visibility:visible; }
  .eyebrow { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:600; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.02em; line-height:1.25; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14.5px; line-height:1.5; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=password] { width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .row { display:flex; align-items:center; gap:8px; margin:14px 0 18px; font-size:14px; color:var(--muted); }
  .row input { accent-color: var(--accent); width:16px; height:16px; margin:0; }
  .row label { font-weight:400; margin:0; }
  button { width:100%; font:inherit; font-weight:600; font-size:15px; padding:10px 14px; border-radius:8px;
    border:0; background:var(--accent); color:var(--card); cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin:12px 0 0; }
  .back { display:inline-block; margin-top:18px; font-size:14px; color:var(--accent); text-decoration:none; }
  noscript p { color:var(--err); }
</style>
</head>
<body>
<main class="card" id="card">
  <p class="eyebrow">Protected</p>
  <h1>Snap-Fit Cantilever Explorer</h1>
  <p class="sub">DM303 teaching resource. Enter the class password to continue.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus />
    <div class="row"><input type="checkbox" id="remember" /><label for="remember">Keep me signed in on this device</label></div>
    <button id="go" type="submit">Unlock</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <a class="back" href="../../">&larr; Back to homepage</a>
  <noscript><p>JavaScript is required to unlock this page.</p></noscript>
</main>

  function ub64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function get(store) { try { return store.getItem(KEY); } catch (e) { return null; } }
  function put(store, v) { try { store.setItem(KEY, v); } catch (e) {} }
  function drop() { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} }

  async function decryptWith(raw) {
    var key = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  async function derive(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256);
    return new Uint8Array(bits);
  }
  // Replace this document with the decrypted page. Wait until the gate page has fully loaded,
  // otherwise document.write would append into the still-open parser stream.
  var loaded = new Promise(function (r) { if (document.readyState === "complete") r(); else window.addEventListener("load", function () { r(); }); });
  async function show(html) { await loaded; document.open(); document.write(html); document.close(); }

  async function tryCached() {
    var c = get(sessionStorage) || get(localStorage);
    if (!c) return false;
    try { var h = await decryptWith(b64(c)); await show(h); return true; } catch (e) { drop(); return false; }
  }

  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking…";
    var pw = document.getElementById("pw").value;
    try {
      var raw = await derive(pw);
      var html = await decryptWith(raw);
      var enc = ub64(raw);
      put(sessionStorage, enc);
      if (document.getElementById("remember").checked) put(localStorage, enc);
      await show(html);
    } catch (e) {
      err.textContent = window.crypto && crypto.subtle ? "Incorrect password." : "This browser cannot decrypt the page (needs HTTPS).";
      btn.disabled = false; btn.textContent = "Unlock";
      document.getElementById("pw").select();
    }
  });

  tryCached().then(function (ok) { if (!ok) { card.classList.add("ready"); document.getElementById("pw").focus(); } });
})();
</script>
</body>
